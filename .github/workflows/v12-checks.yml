name: V12 source and unit checks
on:
  push:
    paths: ['v12/**', '.github/workflows/v12-checks.yml']
  pull_request:
    paths: ['v12/**', '.github/workflows/v12-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v12:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: v12/requirements.txt
      - name: Install CPU validation dependencies
        run: |
          python -m pip install 'torch==2.9.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q src scripts examples tests
          bash -n scripts/setup_scgpt_assets.sh scripts/download_data.sh
      - name: Check model, data, loss and evaluation contracts
        env:
          PYTHONPATH: src:scripts
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python -m unittest discover -s tests -p 'test_subcellular_v12*.py' -v
          python -m unittest discover -s tests -p 'test_visium*mix*.py' -v
          python -m unittest discover -s tests -p 'test_portable_provenance.py' -v

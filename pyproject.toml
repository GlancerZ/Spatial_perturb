[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-pretrain-v2"
version = "0.1.0"
description = "Clean implementation workspace for spatial transcriptomics pretraining"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anndata",
  "numpy",
  "pandas",
  "pyyaml",
  "scikit-learn",
  "scipy",
  "torch",
  "pyarrow",
  "wandb",
  "transformers>=4.51.0",
  "tqdm",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
